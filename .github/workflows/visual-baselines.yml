name: Visual baselines

# Run by hand after an intended visual change. Download the artifact and
# commit its PNGs to e2e/visual/__screenshots__/linux/.
on:
  workflow_dispatch:

jobs:
  baselines:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run build
      - run: npm run test:visual:update
        env:
          CI: 'true'

      - uses: actions/upload-artifact@v4
        with:
          name: visual-baselines-linux
          path: e2e/visual/__screenshots__/linux/
          retention-days: 14
